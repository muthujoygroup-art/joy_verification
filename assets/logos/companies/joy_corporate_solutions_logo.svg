<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jcsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="jcsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="jcsAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="jcsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#jcsBg)" filter="url(#jcsShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Central Corporate Solutions Emblem (Geometric Enterprise Nodes) -->
  <g transform="translate(256, 205)" text-anchor="middle">
    <!-- Outer Connecting Nodes -->
    <circle cx="-80" cy="0" r="24" fill="url(#jcsCyan)" />
    <circle cx="80" cy="0" r="24" fill="url(#jcsCyan)" />
    <circle cx="0" cy="-80" r="24" fill="url(#jcsAmber)" />
    <circle cx="0" cy="70" r="20" fill="url(#jcsCyan)" />

    <!-- Connecting Dynamic Circuit / Solution Links -->
    <path d="M -80 0 L 0 -80 L 80 0 L 0 70 Z" fill="none" stroke="url(#jcsCyan)" stroke-width="8" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Central Hex Core -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#ffffff" />
    <circle cx="0" cy="0" r="16" fill="#312e81" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">
    JOY
  </text>
  
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#a5b4fc" letter-spacing="3.5" text-anchor="middle">
    CORPORATE SOLUTIONS
  </text>
</svg>
